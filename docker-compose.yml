services:
  pebble:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-0}
    container_name: pebble
    env_file:
      - .env
    environment:
      PEBBLE_HOST: 0.0.0.0
      PEBBLE_PORT: 3000
    ports:
      - "${PEBBLE_HTTP_BIND:-127.0.0.1:9191}:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
